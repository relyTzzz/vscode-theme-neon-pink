name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Validate package.json
        run: node -e "JSON.parse(require('fs').readFileSync('package.json', 'utf8'))"

      - name: Validate theme JSON files
        run: |
          fail=0
          while IFS= read -r f; do
            echo "Validating $f..."
            node -e "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'))" "$f" || fail=1
          done < <(find themes -type f -name '*.json' | sort)
          exit $fail

      - name: Run test suite
        run: npm test

      - name: Regenerate palette-driven themes (fails on leftover hexes)
        run: |
          python3 scripts/make-pi-themes.py
          python3 scripts/make-opencode-theme.py
          python3 scripts/make-neon-pink-themes.py

      - name: Ensure generated themes are committed
        run: |
          git diff --exit-code -- themes/
          test -z "$(git status --porcelain -- themes/)"

      - name: Build generated landing page
        run: npm run build:landing

      - name: Ensure generated landing page is committed
        run: git diff --exit-code -- docs/index.html

      - name: Check trailing whitespace
        run: |
          if grep -rn '[[:blank:]]$' --exclude-dir=node_modules --exclude-dir=.git --include='*.json' --include='*.md' --include='*.yml' --include='*.yaml' --include='*.html' --include='*.mjs' .; then
            echo "::error::Trailing whitespace found"
            exit 1
          fi

      - name: Check files end with newline
        run: |
          fail=0
          for f in $(find . \( -name '*.json' -o -name '*.md' -o -name '*.yml' -o -name '*.yaml' -o -name '*.html' -o -name '*.mjs' \) | grep -v node_modules | grep -v .git); do
            if [ -s "$f" ] && [ "$(tail -c1 "$f" | wc -l)" -eq 0 ]; then
              echo "::error file=$f::Missing newline at end of file"
              fail=1
            fi
          done
          exit $fail

      - name: Check for large files
        run: |
          fail=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            echo "::error file=$f::File exceeds 2MB"
            fail=1
          done < <(find . -not -path './.git/*' -not -path './node_modules/*' -not -name '*.vsix' -type f -size +2M)
          exit $fail

  package:
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install vsce
        run: npm install -g @vscode/vsce

      - name: Build landing page
        run: npm run build:landing

      - name: Package extension
        run: vsce package --no-git-tag-version --no-update-package-json

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vscode-extension
          path: '*.vsix'
          retention-days: 30
